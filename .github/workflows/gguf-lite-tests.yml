name: GGUF Lite deterministic tests
on:
  pull_request:
    paths:
      - 'lite/**'
      - 'tests/lite/**'
      - 'requirements-lite.txt'
      - '.github/workflows/gguf-lite-tests.yml'
  workflow_dispatch:
jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated Lite deps
        run: python -m pip install -r requirements-lite-dev.txt
      - name: Install real FFmpeg for decoding regression
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Compile all Lite modules
        run: python -m compileall -q lite
      - name: Behavioral tests
        run: python -m pytest tests/lite -q -ra
